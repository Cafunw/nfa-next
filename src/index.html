<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFA Next</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Titlebar -->
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <div class="logo" data-tauri-drag-region>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/></svg>
        </div>
        <span class="brand-name" data-tauri-drag-region>NFA <b>Next</b></span>
      </div>

      <span class="streamer-badge" id="streamerBadge" data-i18n="streamerBadge" hidden></span>
      <div class="steam-pill" id="steamPill" data-tauri-drag-region>
        <span class="dot"></span>
        <span id="steamText" data-i18n="steamChecking"></span>
      </div>

      <div class="win-ctrls">
        <button class="win-btn" id="winMin" data-i18n-title="minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button class="win-btn" id="winMax" data-i18n-title="maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button class="win-btn close" id="winClose" data-i18n-title="close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.3"/></svg></button>
      </div>
    </header>

    <div class="update-bar" id="updateBar" hidden></div>

    <main class="main">
      <!-- Hero / stats -->
      <section class="hero">
        <div class="hero-text">
          <h1 data-i18n="heroTitle"></h1>
          <p data-i18n="heroSub"></p>
        </div>
        <div class="stats">
          <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label" data-i18n="statAccounts"></span></div>
          <div class="stat"><span class="stat-num" id="statFav">0</span><span class="stat-label" data-i18n="statFav"></span></div>
          <div class="stat"><span class="stat-num stat-active" id="statActive">—</span><span class="stat-label" data-i18n="statActive"></span></div>
        </div>
      </section>

      <!-- Toolbar -->
      <section class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="text" data-i18n-ph="searchPh" autocomplete="off" spellcheck="false" />
          <kbd>Ctrl F</kbd>
        </div>
        <div class="chips" id="chips"></div>
        <select id="sort" class="select" data-i18n-title="sortTitle">
          <option value="smart" data-i18n="sortSmart"></option>
          <option value="recent" data-i18n="sortRecent"></option>
          <option value="name" data-i18n="sortName"></option>
          <option value="login" data-i18n="sortLogin"></option>
          <option value="custom" data-i18n="sortCustom"></option>
        </select>
        <button class="btn icon" id="btnView" data-i18n-title="viewToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><path d="M3 15h18M3 20h18"/></svg>
        </button>
        <button class="btn icon" id="btnCheck" data-i18n-title="checkTitle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/></svg>
        </button>
        <div class="actions">
          <button class="btn ghost" id="btnCapture" data-i18n-title="captureTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
            <span data-i18n="capture"></span>
          </button>
          <button class="btn primary" id="btnAddToken">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="addToken"></span>
          </button>
          <button class="btn icon" id="btnSettings" data-i18n-title="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </div>
      </section>

      <!-- Grid -->
      <section class="grid" id="grid"></section>

      <!-- Empty state -->
      <section class="empty" id="empty" hidden>
        <div class="empty-art">
          <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </div>
        <h2 data-i18n="emptyTitle"></h2>
        <p data-i18n-html="emptyText"></p>
        <div class="empty-actions">
          <button class="btn primary lg" id="emptyCapture" data-i18n="capture"></button>
          <button class="btn ghost lg" id="emptyToken" data-i18n="addToken"></button>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <span id="footPath">—</span>
      <span class="hint" data-i18n-html="footHint"></span>
    </footer>
  </div>

  <!-- Switch overlay -->
  <div class="overlay" id="switchOverlay" hidden>
    <div class="switch-card">
      <div class="switch-avatar" id="switchAvatar"></div>
      <div class="spinner"><div></div><div></div><div></div></div>
      <h3 id="switchTitle"></h3>
      <ol class="steps" id="switchSteps">
        <li data-step="0" data-i18n="step0"></li>
        <li data-step="1" data-i18n="step1"></li>
        <li data-step="2" data-i18n="step2"></li>
      </ol>
    </div>
  </div>

  <!-- Modal root -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Command palette -->
  <div class="palette-backdrop" id="palette" hidden>
    <div class="palette" role="dialog" aria-modal="true">
      <div class="pal-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="palInput" data-i18n-ph="palPh" autocomplete="off" spellcheck="false" />
        <kbd>Esc</kbd>
      </div>
      <div class="pal-list" id="palList"></div>
      <div class="pal-foot" data-i18n-html="palHint"></div>
    </div>
  </div>

  <!-- Context menu -->
  <div class="menu" id="menu" hidden></div>

  <!-- Toasts -->
  <div class="toasts" id="toasts"></div>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
