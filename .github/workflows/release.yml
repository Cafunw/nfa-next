# Builds NFA Next on GitHub's Windows runners and publishes a release.
# Trigger: push a tag like v1.2.0 (the version must match tauri.conf.json).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NFA Next ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new. Download the setup .exe below; installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Upload portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/nfa-next.exe NFA-Next-portable.exe
          gh release upload "$GITHUB_REF_NAME" NFA-Next-portable.exe --clobber
